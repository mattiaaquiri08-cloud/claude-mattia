<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden;background:#fff;font-family:Sora,sans-serif;color:#0f0b1a}
.wrap{display:grid;grid-template-columns:1fr 1fr;height:100%}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative}
.card+.card{border-left:1px solid #ece8f3}
.num{position:absolute;top:60px;font-size:22px;font-weight:600;letter-spacing:.2em;color:#a39db3}
.mark{font-weight:800;font-size:190px;letter-spacing:-.05em;line-height:1.2;
 background:linear-gradient(90deg,#6d28f6 0%,#b05ce6 40%,#f08ac6 75%,#f6b48a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.sub{margin-top:-6px;font-size:44px;font-weight:600;letter-spacing:.02em}
.line{width:60px;height:3px;border-radius:2px;background:#e6e0f0;margin:40px 0 28px}
.slogan{font-size:26px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:#6b6580}
.dom{position:absolute;bottom:60px;font-size:22px;color:#a39db3}
</style></head><body><div class="wrap">
<div class="card"><div class="num">OPZIONE 2</div><div class="mark">MAQ</div><div class="sub">Web Design</div><div class="line"></div><div class="slogan">Grow Online</div><div class="dom">maqwebdesign.com</div></div>
<div class="card"><div class="num">OPZIONE 3</div><div class="mark">MAQ</div><div class="sub">Digital Studio</div><div class="line"></div><div class="slogan">Grow Online</div><div class="dom">maqdigitalstudio.com</div></div>
</div></body></html>
