<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Sora,sans-serif;background:#fff}
.tile{width:1080px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--fg)}
.mark{font-weight:800;font-size:300px;letter-spacing:-.05em;line-height:1.2;padding-right:.04em;
 background:linear-gradient(90deg,#6d28f6 0%,#b05ce6 40%,#f08ac6 75%,#f6b48a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:-14px;font-size:70px;font-weight:600}
.line{width:90px;height:4px;border-radius:2px;background:var(--ln);margin:50px 0 36px}
.slogan{font-size:36px;letter-spacing:.26em;text-transform:uppercase;color:var(--mu)}
.light{--bg:#fff;--fg:#0f0b1a;--ln:#e6e0f0;--mu:#6b6580}
.dark{--bg:#07050d;--fg:#fff;--ln:#2a2438;--mu:#a49dbb}
.icon .mark{font-size:250px;margin-top:-20px}
</style></head><body>
<div class="tile light" id="a"><div class="mark">MAQ</div><div class="sub">Web Design</div><div class="line"></div><div class="slogan">Grow Online</div></div>
<div class="tile dark" id="b"><div class="mark">MAQ</div><div class="sub">Web Design</div><div class="line"></div><div class="slogan">Grow Online</div></div>
<div class="tile light icon" id="c"><div class="mark">MAQ</div></div>
<div class="tile dark icon" id="d"><div class="mark">MAQ</div></div>
</body></html>
