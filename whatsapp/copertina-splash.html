<!doctype html><html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b0816;font-family:Sora,sans-serif;color:#fff}
.glow{position:absolute;left:0;top:0;width:1920px;height:1080px;background:
 radial-gradient(900px 380px at 50% 32%,rgba(124,58,237,.20),transparent 70%),
 radial-gradient(600px 300px at 75% 22%,rgba(236,72,153,.10),transparent 70%)}
.logo{position:absolute;left:50%;top:335px;transform:translate(-50%,-50%);display:inline-flex;flex-direction:column}
.top{display:flex;align-items:center;gap:32px}
.m{font-size:115px;letter-spacing:.02em;line-height:1.1;white-space:nowrap}
.m .a{font-weight:300}
.m .q{font-weight:800;padding-right:.04em;background:linear-gradient(90deg,#6d28f6,#b05ce6 35%,#f08ac6 70%,#f6b48a);-webkit-background-clip:text;background-clip:text;color:transparent}
.vl{width:1.5px;align-self:stretch;margin:24px 0 18px;background:rgba(255,255,255,.2)}
.tx{font-size:21px;letter-spacing:.34em;line-height:1.75;text-transform:uppercase;color:#aaa3c2;padding-top:12px}
.bar{height:2px;margin-top:14px;background:linear-gradient(90deg,#6d28f6,#b05ce6 35%,#f08ac6 70%,#f6b48a)}
.sl{margin-top:16px;text-align:center;padding-left:.38em;font-size:16px;font-weight:300;letter-spacing:.38em;text-transform:uppercase;color:#aaa3c2;white-space:nowrap}
</style></head><body><div class="glow"></div>
<div class="logo"><div class="top"><div class="m"><span class="a">MA</span><span class="q">Q</span></div><div class="vl"></div><div class="tx">Web<br>Design</div></div><div class="bar"></div><div class="sl">Grow Online / Roma</div></div>
</body></html>
